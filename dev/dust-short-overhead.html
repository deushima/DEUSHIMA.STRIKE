<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Dust Short · CT y TT</title><style>
body{margin:0;background:#1a211e;color:#f6f1e3;font:16px system-ui}main{width:1060px;margin:20px auto}
h1{margin:0 0 8px;font-size:26px}p{margin:0 0 14px;color:#d1d9ce}#view{position:relative;width:1060px;height:800px}
canvas{display:block}.marker{position:absolute;padding:5px 9px;font-weight:800;color:white;border-radius:4px;transform:translate(-50%,-50%);pointer-events:none}
.ct{background:#274ac9}.tt{background:#d84234}small{color:#b7c5ba}
</style></head><body><main><h1>DUST SHORT · suelo y spawns originales</h1><p>GLB intacto a escala 96. Ruta física CT↔TT sobre triángulos de colisión.</p><div id="view"></div><small>Azul: CT en adoquín tras la arcada · Rojo: TT en patio de tierra junto al neumático. Captura de desarrollo, no incluida en el build.</small></main>
<script type="module">
import * as T from '/vendor/three.module.js';import {GLTFLoader} from '/vendor/loaders/GLTFLoader.js';
const width=1060,height=800,view=document.getElementById('view'),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(width,height);view.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0xbbbcb4);scene.add(new T.HemisphereLight(0xffffff,0x88837b,2));const sun=new T.DirectionalLight(0xffffff,1.8);sun.position.set(-30,50,20);scene.add(sun);
const root=(await new GLTFLoader().loadAsync('/assets/maps/dust_short.glb')).scene;root.scale.setScalar(96);root.updateMatrixWorld(true);root.position.y-=new T.Box3().setFromObject(root,true).min.y;root.updateMatrixWorld(true);scene.add(root);
const camera=new T.OrthographicCamera(-25,25,18.9,-18.9,.1,200);camera.position.set(29,100,6.5);camera.up.set(0,0,-1);camera.lookAt(29,0,6.5);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
const route=(await (await fetch('/docs/qa-20261026/nav-traces.json')).json())[1].trace;
const line=new T.Line(new T.BufferGeometry().setFromPoints(route.map(row=>new T.Vector3(row.pos[0],row.pos[1]+.12,row.pos[2]))),new T.LineBasicMaterial({color:0x23f0a0,depthTest:false}));line.renderOrder=999;scene.add(line);
function mark(team,x,z,color){const y=team==='CT'?3.85:3.6;const square=new T.Mesh(new T.PlaneGeometry(3.2,3.2),new T.MeshBasicMaterial({color,transparent:true,opacity:.36,depthTest:false,side:T.DoubleSide}));square.rotation.x=-Math.PI/2;square.position.set(x,y,z);square.renderOrder=1000;scene.add(square);const border=new T.LineSegments(new T.EdgesGeometry(new T.PlaneGeometry(3.2,3.2)),new T.LineBasicMaterial({color,depthTest:false}));border.rotation.x=-Math.PI/2;border.position.set(x,y+.01,z);border.renderOrder=1001;scene.add(border);const projected=new T.Vector3(x,y,z).project(camera);const label=document.createElement('span');label.className='marker '+team.toLowerCase();label.textContent=team;label.style.left=((projected.x+1)*width/2)+'px';label.style.top=((1-projected.y)*height/2)+'px';view.append(label);}
mark('CT',19.2,-1.2,0x234ad8);mark('TT',30.6,18,0xed3c33);renderer.render(scene,camera);document.body.dataset.ready='true';
</script></body></html>
